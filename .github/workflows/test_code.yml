name: Test pushed code

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  Test-code:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Setup Poetry
        run: |
          curl -sSL https://install.python-poetry.org > /tmp/install-poetry.py
          export POETRY_HOME=/opt/poetry
          python3 /tmp/install-poetry.py --version 1.3.0
          $POETRY_HOME/bin/poetry --version
          echo "$POETRY_HOME/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: poetry install

      - name: Setup taskfile support
        uses: arduino/setup-task@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: task validate-code

      - name: Upload coverage reports to Codecov
        run: |
          # Replace `linux` below with the appropriate OS
          # Options are `alpine`, `linux`, `macos`, `windows`
          curl -Os https://cli.codecov.io/latest/linux/codecov
          chmod +x codecov
          ./codecov --verbose upload-process --fail-on-error -t ${{ secrets.CODECOV_TOKEN }} -n 'service'-${{ github.run_id }} -F service -f coverage-service.xml
